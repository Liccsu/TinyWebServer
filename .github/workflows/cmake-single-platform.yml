name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmariadb-dev libmariadb-dev-compat \
            ninja-build clang-format clang-tidy

      - name: Configure (Release + tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        working-directory: build
        run: ctest --output-on-failure

      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev libmariadb-dev-compat ninja-build

      - name: Configure (ASan+UBSan)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -G Ninja -DENABLE_SANITIZER=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Run tests under sanitizers
        working-directory: build-asan
        run: ctest --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
